# Local MySQL for development. The app itself runs with `php artisan serve`.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ec_admin
      MYSQL_USER: ec_admin
      MYSQL_PASSWORD: ec_admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
